name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Align Kotlin with Compose compiler
        run: |
          set -e
          echo "Kotlin version references before patch:"
          grep -RIn --include='*.gradle' --include='*.gradle.kts' '1\.9\.24' android node_modules/expo-modules-core || true
          find android node_modules/expo-modules-core -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 -r sed -i 's/1\.9\.24/1.9.25/g'
          echo "Kotlin version references after patch:"
          grep -RIn --include='*.gradle' --include='*.gradle.kts' '1\.9\.24\|1\.9\.25' android node_modules/expo-modules-core || true
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hime-studio-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
