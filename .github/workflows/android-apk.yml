name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Align Kotlin with Compose compiler
        run: |
          set -e
          if grep -q '^android.kotlinVersion=' android/gradle.properties; then
            sed -i 's/^android.kotlinVersion=1.9.24$/android.kotlinVersion=1.9.25/' android/gradle.properties
          else
            echo 'android.kotlinVersion=1.9.25' >> android/gradle.properties
          fi
          echo "Effective Kotlin version property:"
          grep -n '^android.kotlinVersion=' android/gradle.properties
          find android node_modules/expo-modules-core -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 -r sed -i 's/1\.9\.24/1.9.25/g'
          grep -RIn --include='*.gradle' --include='*.gradle.kts' '1\.9\.24\|1\.9\.25' android node_modules/expo-modules-core || true
      - name: Force Kotlin plugin and compiler version
        run: |
          set -e
          cat > /tmp/force-kotlin.init.gradle <<'EOF'
          gradle.beforeProject { project ->
            project.buildscript.configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name.startsWith("kotlin-")) {
                  details.useVersion("1.9.25")
                  details.because("Compose Compiler 1.5.15 requires Kotlin 1.9.25")
                }
              }
            }
            project.configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name.startsWith("kotlin-")) {
                  details.useVersion("1.9.25")
                  details.because("Compose Compiler 1.5.15 requires Kotlin 1.9.25")
                }
              }
            }
          }
          EOF
          echo "Kotlin resolution override prepared"
      - name: Build installable APK
        working-directory: android
        run: ./gradlew -I /tmp/force-kotlin.init.gradle assembleDebug --no-daemon --refresh-dependencies
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hime-studio-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
