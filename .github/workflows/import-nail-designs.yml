name: Import nail designs

on:
  workflow_dispatch:
    inputs:
      target_catalog:
        description: "Stop when the catalog reaches this many unique designs"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: nail-design-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import licensed nail designs
        env:
          SUPABASE_URL: https://xtvjojfkphqbssafefyz.supabase.co
          # Legacy anon key is a public JWT key, not a service_role/secret key.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0dmpvamZrcGhxYnNzYWZlZnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxOTk5NzksImV4cCI6MjExMDc3NTk3OX0.iU_0D9cuIBqVzAbyM_GKHqzJV0zEHQH52az1OIA9VFfE
          TARGET: ${{ inputs.target_catalog }}
          BATCH_SIZE: "10"
          DELAY_MS: "1200"
        run: node scripts/import-nail-designs.mjs
